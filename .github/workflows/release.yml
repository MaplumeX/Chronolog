name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create GitHub Release
  packages: write # push image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # MaplumeX/Chronolog -> ghcr.io/maplumex/chronolog

jobs:
  build-and-push-image:
    name: Build & push image (amd64/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v1.2.3 -> 1.2.3
            type=semver,pattern={{version}}
            # v1.2.3 -> 1.2
            type=semver,pattern={{major}}.{{minor}}
            # v1.2.3 -> latest (skipped for pre-releases)
            type=semver,pattern=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release (changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog
        run: |
          npm install --no-save conventional-changelog-cli
          # List releases including this tag; take only the section for this tag
          npx conventional-changelog-cli -p conventionalcommits \
            -u "https://github.com/${{ github.repository }}" \
            -t v -r 2 > FULL_CHANGELOG.md
          # Keep only the section for the current tag (last released section
          # is at the top, "Unreleased" may precede it)
          TAG="${{ github.ref_name }}"
          # strip the leading "v" for section matching (changelog headings use bare versions)
          VERSION="${TAG#v}"
          python3 - "$TAG" "$VERSION" <<'EOF'
          import re, sys
          tag, version = sys.argv[1], sys.argv[2]
          text = open('FULL_CHANGELOG.md').read()
          # Find the section heading for this version (bare, without "v")
          m = re.search(rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          body = m.group(1).strip() if m else ''
          header = f'# {tag}\n\n'
          open('RELEASE_BODY.md', 'w').write(header + body + '\n')
          EOF
          cat RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          generate_release_notes: false
